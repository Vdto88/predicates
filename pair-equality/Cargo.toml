[package]
name = "pair-equality"
version = "0.1.0"
edition = "2021"
description = "A predicate alkane that enforces quantities of alkanes sent to it in a two-party trade"
authors = ["flex"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alkanes-support.workspace = true
alkanes-runtime.workspace = true
# metashrew-support is referenced by the WIT-generated entry points
# (to_arraybuffer_layout / to_passback_ptr), not by lib.rs directly.
metashrew-support.workspace = true
anyhow.workspace = true

[build-dependencies]
alkanes-wit-build = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "ad27105f" }

[dev-dependencies]
once_cell.workspace = true
wasm-bindgen-test.workspace = true
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "ad27105f", features = ["test-utils"] }

[features]
default = []
test = []

[[test]]
name = "pair_equality_test"
path = "tests/pair_equality_test.rs"